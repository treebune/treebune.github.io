<div class="about-wrap">
  <p class="section-label" style="margin-bottom:2rem;">關於</p>
  <div class="about-body">
    <p>想像力是我的超能力，當我試著表達對於某些事物的看法時，它們會以故事型態碎裂。我無法一次拾起所有的碎片，只能先將它們裝到合適的容器，直到收集完整。</p>
    <p>大多數的文章平台都在說新事，但對故事而言，那是逆向時間線。因此我自己架站，集結自2005年起的一些文章，和所說的故事。</p>
    <blockquote class="about-quote">
      我正孤獨通過自己行星的曠野<br>
      — 夏宇《在陣雨之間》
    </blockquote>
  </div>
